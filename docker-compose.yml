# Demostración local contra Supabase — la MISMA base que usa producción.
#
#   .\scripts\preparar-env-local.ps1     # una vez: escribe .env leyendo Parameter Store
#   docker compose up --build
#   curl http://localhost:8080/v1/health
#
# Levanta los cuatro microservicios como contenedores OCI y un API Gateway local que
# traduce HTTP corriente al evento que esperan las funciones. La topología es la misma que
# en producción: un único punto de entrada delante de cuatro servicios autónomos.
#
# Cuatro decisiones que conviene explicar:
#
# 1. Las imágenes son EXACTAMENTE las mismas que se desplegarían. No hay una variante
#    "de desarrollo": lo que se demuestra aquí es lo que correría en la nube.
#
# 2. La FUENTE DE LA VERDAD es Supabase. Los contenedores no llevan base propia: se
#    conectan al mismo Postgres gestionado que usan las Lambdas de producción, por el
#    pooler en modo transacción (puerto 6543) y con TLS. Lo que se escriba aquí queda
#    escrito de verdad, y lo que se lea es el estado real del sistema.
#
# 3. Cada servicio se conecta con SU PROPIO rol Postgres (svc_intake, svc_dispatch...),
#    nunca con la service_role key de Supabase. Así RLS sigue aplicando también al
#    backend, que es justo lo que se pierde con service_role.
#
# 4. Las cadenas de conexión NO están en este archivo. Viven en Parameter Store cifradas
#    y se materializan en un .env local que .gitignore excluye. El enunciado prohíbe
#    secretos en el repositorio y esa prohibición no admite una excepción "solo para la
#    demo".
#
# Si necesitas una demostración autocontenida —sin cuenta de Supabase ni de AWS, para que
# alguien más pueda levantarla en su máquina— existe el modo con Postgres efímero:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

x-microservicio: &microservicio
  expose: ['8080'] # El Runtime Interface Emulator de la imagen base escucha aquí.
  restart: unless-stopped

x-entorno: &entorno
  AWS_REGION: us-east-2
  LOG_LEVEL: info
  AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
  ORIGEN_PERMITIDO: 'http://localhost:3000'
  # Supabase exige TLS: la conexión sale de esta máquina hacia el pooler por internet.
  # El modo local lo pone a 'false' porque su Postgres vive en la red interna de docker.
  DB_TLS: 'true'

services:
  # ---------------------------------------------------------------------------------
  # Microservicios
  #
  # `${VAR:?mensaje}` falla el arranque con un error legible si la variable no está, en
  # vez de construir una cadena de conexión inválida y morir más tarde con un error de
  # host que no apunta a la causa real.
  # ---------------------------------------------------------------------------------
  intake:
    <<: *microservicio
    build: { context: ., dockerfile: services/intake/Dockerfile }
    image: emergencias-intake:local
    container_name: emergencias-intake
    environment:
      <<: *entorno
      SERVICE_NAME: intake
      DATABASE_URL: ${DATABASE_URL_INTAKE:?falta DATABASE_URL_INTAKE. Ejecuta scripts/preparar-env-local.ps1}
      # Sin SQS en local: intake registra la emergencia en Supabase y el envío a la cola
      # falla. La respuesta lo dice con "despacho_encolado": false. El camino completo con
      # cola se demuestra contra producción.
      COLA_DESPACHOS_URL: ''

  dispatch:
    <<: *microservicio
    build: { context: ., dockerfile: services/dispatch/Dockerfile }
    image: emergencias-dispatch:local
    container_name: emergencias-dispatch
    environment:
      <<: *entorno
      SERVICE_NAME: dispatch
      DATABASE_URL: ${DATABASE_URL_DISPATCH:?falta DATABASE_URL_DISPATCH. Ejecuta scripts/preparar-env-local.ps1}

  geo:
    <<: *microservicio
    build: { context: ., dockerfile: services/geo/Dockerfile }
    image: emergencias-geo:local
    container_name: emergencias-geo
    environment:
      <<: *entorno
      SERVICE_NAME: geo
      DATABASE_URL: ${DATABASE_URL_GEO:?falta DATABASE_URL_GEO. Ejecuta scripts/preparar-env-local.ps1}

  notify:
    <<: *microservicio
    build: { context: ., dockerfile: services/notify/Dockerfile }
    image: emergencias-notify:local
    container_name: emergencias-notify
    environment:
      <<: *entorno
      SERVICE_NAME: notify
      DATABASE_URL: ${DATABASE_URL_NOTIFY:?falta DATABASE_URL_NOTIFY. Ejecuta scripts/preparar-env-local.ps1}

  # ---------------------------------------------------------------------------------
  # Punto único de entrada
  # ---------------------------------------------------------------------------------
  gateway:
    # Node a secas: este contenedor solo reenvía peticiones y no necesita dependencias.
    image: node:22-alpine
    container_name: emergencias-gateway
    working_dir: /app
    command: ['node', 'gateway.js']
    volumes:
      - ./local:/app:ro
    ports:
      - '8080:8080'
    environment:
      PUERTO: '8080'
    depends_on: [intake, dispatch, geo, notify]
    restart: unless-stopped
