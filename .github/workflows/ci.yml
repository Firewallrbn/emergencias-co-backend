name: CI

# Se ejecuta en cada push y en cada pull request. No despliega nada: solo comprueba que
# lo que entra al repositorio esta sano. El despliegue vive en deploy.yml y solo corre
# sobre main.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Secretos, tipos y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks necesita el historial COMPLETO. El checkout por defecto trae un solo
          # commit, y entonces el escaneo pasaria aunque hubiera un secreto en cualquier
          # commit anterior — que es justo lo que el enunciado prohibe.
          fetch-depth: 0

      - name: Buscar secretos en todo el historial
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobar tipos de todos los paquetes
        run: |
          for proyecto in packages/shared services/*; do
            if [ -f "$proyecto/tsconfig.json" ]; then
              echo "::group::$proyecto"
              npx tsc --noEmit -p "$proyecto/tsconfig.json"
              echo "::endgroup::"
            fi
          done

      - name: Pruebas unitarias
        run: npm test

      # Construir aqui no es redundante con el despliegue: detecta un fallo de empaquetado
      # en un pull request, antes de que llegue a main, en vez de a mitad de un canary.
      - name: Verificar que los cuatro servicios empaquetan
        run: |
          for servicio in intake dispatch geo notify; do
            npm run build --workspace "@emergencias/$servicio"
            tamano=$(stat -c%s "services/$servicio/dist/index.js")
            echo "$servicio: $((tamano / 1024)) KB"
          done
